# CapybaraWG - WireGuard Configuration with udp2raw Obfuscation
# This config requires udp2raw to be running for obfuscation

[Interface]
# Client private key (user-specific)
PrivateKey = {{CLIENT_PRIVATE_KEY}}

# Client VPN IP address
Address = {{CLIENT_VPN_IP}}/24

# Optimized MTU for obfuscated traffic
MTU = 1280

# DNS servers
DNS = 1.1.1.1, 8.8.8.8

# Start udp2raw tunnel before bringing up WireGuard
# CapybaraWG GUI now supports PreUp/PostDown hooks with admin privileges
PreUp = /usr/local/bin/udp2raw -c -l 127.0.0.1:4096 -r {{SERVER_IP}}:443 -k {{UDP2RAW_PASSWORD}} --raw-mode faketcp --cipher-mode xor --auth-mode hmac_sha1 > /tmp/udp2raw_wg.log 2>&1 &

# Stop udp2raw tunnel after bringing down WireGuard
PostDown = killall udp2raw || true

[Peer]
# Server public key
PublicKey = {{SERVER_PUBLIC_KEY}}

# Route all traffic through VPN
AllowedIPs = 0.0.0.0/0

# Endpoint points to LOCAL udp2raw tunnel (not directly to server)
# udp2raw listens on localhost:4096 and forwards to server:443
Endpoint = 127.0.0.1:4096

# Keep connection alive through NAT/firewalls
PersistentKeepalive = 25
